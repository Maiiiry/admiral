---
- name: Check if SELinux is enabled
  command: getenforce
  register: selinux_status
  changed_when: false

- name: Ensure SELinux is enforcing
  command: setenforce 1
  when: selinux_status.stdout == "Permissive"

- name: Persist SELinux enforcing mode across reboots
  lineinfile:
    path: /etc/selinux/config
    regexp: '^\s*SELINUX\s*='
    line: SELINUX=enforcing
    backup: true

- name: Read SELinux enforcing runtime state
  command: getenforce
  register: admiral_selinux_runtime_final
  changed_when: false

- name: Verify SELinux enforcing boot policy
  command:
    argv:
      - grep
      - -E
      - '^[[:space:]]*SELINUX[[:space:]]*=[[:space:]]*enforcing[[:space:]]*$'
      - /etc/selinux/config
  register: admiral_selinux_config_final
  changed_when: false
  failed_when: false

- name: Assert SELinux remains enforcing at runtime and after reboot
  assert:
    that:
      - admiral_selinux_runtime_final.stdout == 'Enforcing'
      - admiral_selinux_config_final.rc == 0
    fail_msg: >-
      SELinux must be Enforcing now and configured as SELINUX=enforcing for the
      next boot. If SELinux was disabled previously, reboot and relabel before
      running Admiral workloads.

- name: Read SELinux permission for reverse proxy connections
  command:
    argv:
      - getsebool
      - httpd_can_network_connect
  register: admiral_httpd_can_network_connect
  changed_when: false
  when: ansible_selinux.status == 'enabled'

- name: Allow the reverse proxy to reach loopback services
  command:
    argv:
      - setsebool
      - -P
      - httpd_can_network_connect
      - "on"
  when:
    - ansible_selinux.status == 'enabled'
    - "'--> on' not in admiral_httpd_can_network_connect.stdout"
