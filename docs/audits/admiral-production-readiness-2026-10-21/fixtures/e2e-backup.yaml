name: e2e-backup
display_name: E2E Backup and Restore
description: Disposable database workload for release audit backup testing.

services:
  app:
    image: docker.io/traefik/whoami:v1.10
    port: 80
    public: true
    backup:
      type: none

  db:
    image: docker.io/library/postgres:16
    volume: db_data
    backup:
      type: database
      engine: postgresql
      database_env: POSTGRES_DB
      username_env: POSTGRES_USER
      password_env: POSTGRES_PASSWORD
    env:
      POSTGRES_DB: whoami
    secrets:
      POSTGRES_USER:
        generate: username
        expose: true
      POSTGRES_PASSWORD:
        generate: password
        expose: true

tiers:
  small:
    cpu: 1
    memory: 512M
    storage: 1G
    price_monthly: 5
    backups:
      enabled: true
      schedule: disabled
      retention:
        count: 7
        days: 30
      manual_backups: true
      backup_database: true
      backup_volumes: false
      restore_allowed: true
