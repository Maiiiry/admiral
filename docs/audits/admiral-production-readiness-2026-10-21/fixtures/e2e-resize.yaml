name: e2e-resize-audit
display_name: E2E Resize Audit
description: Disposable database workload for testing persistent tier resize behavior.

services:
  app:
    image: docker.io/traefik/whoami:v1.10
    port: 80
    public: true
    backup:
      type: none

  db:
    image: docker.io/library/postgres:16
    volume: db_data
    backup:
      type: database
      engine: postgresql
      database_env: POSTGRES_DB
      username_env: POSTGRES_USER
      password_env: POSTGRES_PASSWORD
    env:
      POSTGRES_DB: resize_audit
    secrets:
      POSTGRES_USER:
        generate: username
        expose: true
      POSTGRES_PASSWORD:
        generate: password
        expose: true

tiers:
  small:
    cpu: 1
    memory: 512M
    storage: 1G
    price_monthly: 5
  medium:
    cpu: 1
    memory: 768M
    storage: 1G
    price_monthly: 8
