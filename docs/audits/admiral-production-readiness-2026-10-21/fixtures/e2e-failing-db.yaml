name: e2e-failing-db-audit
display_name: E2E Failing Database Audit
description: Disposable audit fixture that keeps the app pod running while its declared database process exits.

services:
  app:
    image: docker.io/traefik/whoami:v1.10
    port: 80
    public: true
    backup:
      type: none

  db:
    image: docker.io/library/postgres:16
    command: /bin/false
    volume: db_data
    backup:
      type: database
      engine: postgresql
      database_env: POSTGRES_DB
      username_env: POSTGRES_USER
      password_env: POSTGRES_PASSWORD
    env:
      POSTGRES_DB: audit_failure
    secrets:
      POSTGRES_USER:
        generate: username
        expose: true
      POSTGRES_PASSWORD:
        generate: password
        expose: true

tiers:
  small:
    cpu: 1
    memory: 512M
    storage: 1G
    price_monthly: 5
